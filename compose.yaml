services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repeatme
      POSTGRES_PASSWORD: repeatme
      POSTGRES_DB: repeatme
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - repeatme_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repeatme"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  repeatme_pg:
